apiVersion: v1
kind: Namespace
metadata:
  name: ml-serving
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-api-config
  namespace: ml-serving
data:
  DECISION_THRESHOLD: "0.5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-api
  namespace: ml-serving
  labels: {app: loan-api}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: loan-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: loan-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: loan-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: loan-api-config}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: loan-api
  namespace: ml-serving
spec:
  selector: {app: loan-api}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loan-api
  namespace: ml-serving
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loan-api
                port: {number: 80}
